# Configuración de rugby-stats-ia
#
# Este archivo no sabe nada de ningún club en particular. Los equipos, las
# camisetas y los jugadores se cargan por partido desde la interfaz.
# Acá van las decisiones que valen para cualquier partido.

modelo:
  # Modelo de Gemini a usar. Verificado con free tier al 13/11/2026.
  nombre: gemini-3.8-flash
  # Si el principal da error de cuota o no existe, se prueban estos en orden.
  alternativas:
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
  # Temperatura baja: queremos datos repetibles, no creatividad.
  temperatura: 0.1

# Las tres velocidades. fps = cuadros por segundo que se le mandan al modelo.
# Gemini acepta de 0 (exclusivo) a 24. resolucion LOW ≈ 100 tokens por segundo
# de video, HIGH ≈ 300: la alta se usa solo donde hace falta.
velocidades:
  # Pasada 1: separar juego de tiempo muerto y leer el marcador.
  gruesa:
    fps: 0.5
    resolucion: MEDIA_RESOLUTION_LOW
    ventana_s: 600
  # Pasada 2: seguir la secuencia y encontrar los contactos.
  juego:
    fps: 2.0
    resolucion: MEDIA_RESOLUTION_LOW
    ventana_s: 120
  # Pasada 3: el contacto en detalle. Quién entró al tackle, si el portador
  # avanzó, si la pelota fue hacia adelante.
  contacto:
    fps: 10.0
    resolucion: MEDIA_RESOLUTION_HIGH
    ventana_s: 3.0
    # Cuánto antes y después del momento marcado se mira.
    margen_antes_s: 1.5
    margen_despues_s: 1.5
  # Armado de fichas: buscar el número en la espalda en cuadros claros.
  fichas:
    fps: 3.0
    resolucion: MEDIA_RESOLUTION_HIGH
    ventana_s: 60

ventanas:
  # Solape entre ventanas consecutivas, para no perder jugadas partidas al medio.
  solape_s: 5

reglas:
  # Criterio de tackle positivo. Dos valores posibles:
  #   portador_detenido -> positivo si el portador NO avanza (se queda o retrocede)
  #   portador_avanza   -> positivo si el portador SÍ avanza
  # Por defecto el primero, que es la convención del rugby: un tackle dominante
  # frena o hace retroceder al portador.
  tackle_positivo: portador_detenido
  # Cuántos centímetros de avance se toleran antes de considerar que avanzó.
  tolerancia_avance_cm: 50
  # Debajo de esta confianza, el evento va obligatoriamente a revisión humana.
  umbral_confianza_revision: 0.85
  # Cuando un tipo de evento supera esta precisión confirmada, se puede dejar
  # de revisar ese tipo.
  umbral_precision_objetivo: 0.95
  # "Sin clasificar no vale": cuántas veces se vuelve a mirar un evento sin
  # jugador o sin resultado antes de mandarlo a la cola como pendiente.
  reintentos_sin_clasificar: 2
  # Los metros ganados son una estimación: la cámara panea y hace zoom.
  metros_son_estimados: true

puntos:
  try: 5
  conversion: 2
  penal: 3
  drop: 3
  try_penal: 7

api:
  # Pedidos por minuto con los que arranca la cola. No es un límite oficial:
  # el límite real depende del modelo y de la cuenta, y se ve en AI Studio.
  # Ante un 429 la cola baja el ritmo sola.
  rpm_inicial: 8
  # Espera en segundos ante error 429, en orden.
  espera_429_s: [5, 15, 45, 120]
  max_reintentos: 4
  # Caché en disco de cada respuesta, para que el análisis sea reanudable.
  cache: true
  cache_dir: data/cache

video:
  # Bajar el video de YouTube y subirlo a Google en lugar de pasar el link.
  # 0 = nunca (lo normal). Un número = bajar si el video dura más de esos
  # segundos.
  #
  # Había reportes de que, al pasar un link de YouTube con recorte, viajaba el
  # audio del video entero en cada pedido. En la prueba real del 14/11/2026 no
  # pasó: 12 segundos de video costaron 829 tokens. Así que por defecto se
  # pasa el link directo, que además es mucho más rápido para arrancar.
  # Si el diagnóstico (6_prueba_real.bat) alguna vez muestra miles de tokens
  # por segundo de video, poné acá 1200.
  descargar_si_dura_mas_de_s: 0
  # Carpeta donde se guardan los videos bajados y los clips cortados.
  dir_trabajo: data/video
  # Largo del clip que se muestra en la cola de revisión.
  clip_revision_s: 6

salida:
  dir: salidas
  # Una fila por jugador de qué equipos. propio | ambos
  jugadores_de: propio
