# Configuración de rugby-stats-ia
#
# ---------------------------------------------------------------------------
# QUIÉN MIRA EL VIDEO
# ---------------------------------------------------------------------------
#   claude  -> la API de Claude (Anthropic). Pago por uso, sin cupos diarios.
#              Claude no recibe video: el programa baja el tramo a analizar,
#              saca cuadros y se los manda como imágenes. El relato sale de
#              los subtítulos automáticos de YouTube. La clave va en .env como
#              ANTHROPIC_API_KEY.
#   gemini  -> la API de Gemini (Google). Recibe el video entero y escucha el
#              audio. Tiene plan gratis con cupos diarios muy chicos. La clave
#              va en .env como GEMINI_API_KEY.
proveedor: claude

claude:
  # Modelos por nivel. "fuerte" para lo difícil (leer números, decidir quién
  # tackleó); "liviano" para el volumen (juego / tiempo muerto, eventos,
  # relato, cambios). Se puede poner el mismo modelo en los dos.
  modelos:
    fuerte:
      - claude-sonnet-5-5
    liviano:
      - claude-haiku-5-5
    # Segunda opinión: cuando el fuerte duda de QUIÉN tackleó, se le vuelve a
    # preguntar a este. Si coinciden, sube la confianza; si no, va a revisión
    # con los dos candidatos. Borralo para no usarlo.
    experto:
      - claude-opus-5-5
  # Cuánto "piensa" el modelo antes de contestar. Lo que piensa se cobra como
  # salida, así que para extraer datos alcanza con "low". Valores: low,
  # medium, high, xhigh, max.
  esfuerzo: low
  # TOPE DE GASTO por partido, en dólares. Antes de cada pedido se calcula
  # cuánto va a costar, y si con eso se pasa del tope, el análisis frena con
  # un aviso. Lo hecho queda guardado. 0 = sin tope (no recomendado).
  tope_usd_por_partido: 10
  # Cuántos cuadros como máximo en un solo pedido. Si una ventana pide más,
  # se bajan los cuadros por segundo para que entren.
  max_cuadros_por_pedido: 80
  # Precios en dólares por millón de tokens, verificados el 23/11/2026 en
  # platform.claude.com. Sirven para estimar y para el tope: si cambian,
  # actualizalos acá. Haiku cuesta 5 veces más si un pedido pasa de 100.000
  # tokens; los pedidos de este programa quedan bastante por debajo.
  precios:
    claude-sonnet-5-5: {entrada: 2.00, salida: 10.00, cache_lectura: 0.10, cache_escritura: 2.50}
    claude-haiku-5-5: {entrada: 0.10, salida: 0.50, cache_lectura: 0.01, cache_escritura: 0.125}
    claude-opus-5-5: {entrada: 4.00, salida: 20.00, cache_lectura: 0.20, cache_escritura: 5.00}
  # Velocidades para Claude. Pisan a las de "velocidades" (más abajo).
  # Cada cuadro cuesta ancho/28 x alto/28 tokens: uno de 640 px son ~300
  # tokens, uno de 1008 px ~750.
  velocidades:
    gruesa:   {fps: 0.2, ventana_s: 300, ancho: 448}
    juego:    {fps: 2.0, ventana_s: 30,  ancho: 640}
    # En el contacto se mira 1,5 s antes y 6 s DESPUÉS: el número aparece
    # cuando el tackleador se levanta y vuelve a la línea. Con zoom, "ancho"
    # es el del recorte ampliado.
    contacto: {fps: 3.0, ventana_s: 1.0, ancho: 672, margen_antes_s: 1.5, margen_despues_s: 6.0}
    fichas:   {fps: 1.0, ventana_s: 40,  ancho: 1008}
    # Para ubicar dónde está el contacto en cada momento (antes del zoom).
    localizar: {fps: 2.0, ventana_s: 1.0, ancho: 640}
  # ZOOM AL CONTACTO. Primero el liviano marca dónde está el contacto en cada
  # cuadro; después al fuerte se le mandan esos cuadros recortados y
  # ampliados, sacados del video en alta. activo: false = cancha entera.
  zoom:
    activo: true
    ancho_fuente: 1920   # de qué tamaño se saca el cuadro antes de recortar
    escala: 2.2          # cuánto más grande que la caja del contacto
    minimo: 0.3          # el recorte nunca es menos que esto del ancho
    contexto_fps: 1.0    # cuadros de la cancha entera que se suman, por segundo
    contexto_ancho: 512
  # Fotos por jugador que se juntan como referencia (en momentos distintos),
  # y cuántas ventanas de video se miran como mucho para juntarlas.
  fotos_por_jugador: 3
  max_ventanas_fichas: 10
  # Si la confianza en QUIÉN tackleó queda por debajo de esto, se pide la
  # segunda opinión al modelo "experto".
  umbral_segunda_opinion: 0.6

# ---------------------------------------------------------------------------
#
# Este archivo no sabe nada de ningún club en particular. Los equipos, las
# camisetas y los jugadores se cargan por partido desde la interfaz.
# Acá van las decisiones que valen para cualquier partido.

# Los modelos, en dos niveles.
#
# El plan gratis de Google da MUY pocos pedidos por día a los modelos buenos y
# muchos a los livianos. Medido en la cuenta el 14/11/2026 (se ve en
# https://ai.dev/rate-limit, columna RPD):
#
#     gemini-3.8-flash        5 por minuto     20 por día
#     gemini-3.6-flash        5 por minuto     20 por día
#     gemini-4-hydrogen       5 por minuto     20 por día
#     gemini-3.5-flash-lite  15 por minuto    500 por día
#     gemini-3.1-flash-lite  15 por minuto    500 por día
#
# Por eso el trabajo se reparte: lo que es volumen va a los livianos, y los
# pocos pedidos de los buenos se guardan para lo difícil (ver "pasos").
modelos:
  # Para lo difícil: leer números de camiseta y resolver quién tackleó.
  # Se usan en orden; cuando a uno se le acaba el cupo del día, sigue el otro.
  fuerte:
    - gemini-3.8-flash
    - gemini-3.6-flash
    - gemini-4-hydrogen
  # Para el volumen: separar juego de tiempo muerto, relato, eventos.
  liviano:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  # Ritmo al que se le pide a cada nivel, por debajo del tope de Google para
  # no rozarlo (y para no pasarse de tokens por minuto con video).
  pedidos_por_minuto:
    fuerte: 4
    liviano: 8
  # Solo informativo: se usa para mostrar cuánto cupo va quedando.
  cupo_diario:
    gemini-3.8-flash: 20
    gemini-3.6-flash: 20
    gemini-4-hydrogen: 20
    gemini-3.5-flash-lite: 500
    gemini-3.1-flash-lite: 500
  # Qué hacer cuando se acaban los pedidos del día de los modelos fuertes:
  #   frenar              -> corta ahí; al otro día se sigue desde donde quedó.
  #                          Es lo que cuida la precisión.
  #   seguir_con_liviano  -> termina el mismo día con los modelos livianos,
  #                          que identifican peor. Más eventos van a revisión.
  si_se_agota_el_fuerte: frenar
  # Temperatura baja: queremos datos repetibles, no creatividad.
  temperatura: 0.1

# Qué nivel de modelo usa cada paso. "fuerte" gasta del cupo chico.
pasos:
  gruesa: liviano      # juego / tiempo muerto / marcador
  relato: liviano      # transcripción
  cambios: liviano
  eventos: liviano     # primera detección; lo dudoso se re-examina después
  fichas: fuerte       # leer el número en la espalda
  contactos: fuerte    # quién tackleó y si el portador avanzó

analisis:
  # true  -> solo interesa el equipo propio. Del rival no se guarda ningún
  #          evento ni se intenta saber qué jugador fue. Es más rápido, gasta
  #          menos pedidos y deja mucho menos para revisar.
  # false -> se registran las acciones de los dos equipos.
  solo_equipo_propio: true
  # Qué acciones se miden. "tackles" -> solo tackles (y tackles errados) del
  # equipo propio: TODOS los contactos se re-examinan a alta velocidad, con
  # zoom, y lo demás (pases, rucks, patadas) no se mira, así la plata va a lo
  # que importa. "todo" -> todas las acciones.
  medir: tackles

# Las tres velocidades. fps = cuadros por segundo que se le mandan al modelo.
# Gemini acepta de 0 (exclusivo) a 24. resolucion LOW ≈ 100 tokens por segundo
# de video, HIGH ≈ 300: la alta se usa solo donde hace falta.
velocidades:
  # Pasada 1: separar juego de tiempo muerto y leer el marcador.
  gruesa:
    fps: 0.5
    resolucion: MEDIA_RESOLUTION_LOW
    ventana_s: 600
  # Pasada 2: seguir la secuencia y encontrar los contactos.
  juego:
    fps: 2.0
    resolucion: MEDIA_RESOLUTION_LOW
    ventana_s: 120
  # Pasada 3: el contacto en detalle. Quién entró al tackle, si el portador
  # avanzó, si la pelota fue hacia adelante.
  contacto:
    fps: 10.0
    resolucion: MEDIA_RESOLUTION_HIGH
    ventana_s: 3.0
    # Cuánto antes y después del momento marcado se mira.
    margen_antes_s: 1.5
    margen_despues_s: 1.5
  # Armado de fichas: buscar el número en la espalda en cuadros claros.
  fichas:
    fps: 3.0
    resolucion: MEDIA_RESOLUTION_HIGH
    ventana_s: 60

ventanas:
  # Solape entre ventanas consecutivas, para no perder jugadas partidas al medio.
  solape_s: 5

reglas:
  # Criterio de tackle positivo:
  #   portador_retrocede -> positivo si lo lleva para atrás, neutro si lo frena
  #                         en el lugar, negativo si avanza (el de Nico)
  #   portador_detenido  -> positivo si el portador NO avanza (se queda o retrocede)
  #   portador_avanza    -> positivo si el portador SÍ avanza
  tackle_positivo: portador_retrocede
  # Cuántos centímetros de avance se toleran antes de considerar que avanzó.
  tolerancia_avance_cm: 50
  # Debajo de esta confianza, el evento va obligatoriamente a revisión humana.
  umbral_confianza_revision: 0.85
  # Cuando un tipo de evento supera esta precisión confirmada, se puede dejar
  # de revisar ese tipo.
  umbral_precision_objetivo: 0.95
  # "Sin clasificar no vale": cuántas veces se vuelve a mirar un evento sin
  # jugador o sin resultado antes de mandarlo a la cola como pendiente.
  reintentos_sin_clasificar: 2
  # Los metros ganados son una estimación: la cámara panea y hace zoom.
  metros_son_estimados: true

puntos:
  try: 5
  conversion: 2
  penal: 3
  drop: 3
  try_penal: 7

api:
  # Espera en segundos cuando Google pide ir más despacio o está saturado y
  # no dice cuánto esperar. (Si lo dice, se le hace caso.)
  espera_429_s: [5, 15, 45]
  max_reintentos: 3
  # Caché en disco de cada respuesta, para que el análisis sea reanudable.
  cache: true
  cache_dir: data/cache

video:
  # Bajar el video de YouTube y subirlo a Google en lugar de pasar el link.
  # 0 = nunca (lo normal). Un número = bajar si el video dura más de esos
  # segundos.
  #
  # Había reportes de que, al pasar un link de YouTube con recorte, viajaba el
  # audio del video entero en cada pedido. En la prueba real del 14/11/2026 no
  # pasó: 12 segundos de video costaron 829 tokens. Así que por defecto se
  # pasa el link directo, que además es mucho más rápido para arrancar.
  # Si el diagnóstico (6_prueba_real.bat) alguna vez muestra miles de tokens
  # por segundo de video, poné acá 1200.
  descargar_si_dura_mas_de_s: 0
  # Calidad con la que se baja el video para Claude (alto en píxeles). 720
  # alcanza para leer números; más es más lento de bajar sin ganar mucho.
  calidad_descarga: 1080
  # Carpeta donde se guardan los videos bajados y los clips cortados.
  dir_trabajo: data/video
  # Largo del clip que se muestra en la cola de revisión.
  clip_revision_s: 6

salida:
  dir: salidas
  # Una fila por jugador de qué equipos. propio | ambos
  jugadores_de: propio
